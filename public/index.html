<!DOCTYPE html>
<html>
<head>
    <title>Clarifly</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📩</text></svg>">
    <script 
    crossorigin="anonymous" 
    data-clerk-publishable-key="CLERK_PUBLISHABLE_KEY" 
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js" 
    type="text/javascript">
</script>

    <style>
    
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: sans-serif;
        
        background: linear-gradient(135deg, #2f7acb 0%, #7b00ff 100%);
        background-size: cover;
        background-attachment: fixed; 
        
        color: white; 
        
        display: flex;
        flex-direction: column;
        justify-content: center; 
        align-items: center;    
        text-align: center;
    }

    #auth-links {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    #app-content {
        display: none; 
        background: rgba(255, 255, 255, 0.15); 
        backdrop-filter: blur(50px); 
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 8px 28px rgba(225, 220, 220, 0.500);
        max-width: 600px;
        width: 90%; 
        text-align: left;
    }

    textarea { 
        width: 100%; 
        height: 120px; 
        margin: 15px 0; 
        border-radius: 8px; 
        border: 1px solid #ccc;
        padding: 10px;
        box-sizing: border-box; 
    }
    
    button { 
        background: white; 
        color: #007bff; 
        border: none; 
        padding: 12px 24px; 
        cursor: pointer; 
        border-radius: 8px; 
        font-weight: bold;
        font-size: 1.1em;
        transition: transform 0.1s ease;
    }
    
    button:hover { background: #eee; }
    button:active { transform: scale(0.98); }

    #output { 
        background: rgba(255, 255, 255, 0.9); 
        color: #333;
        padding: 20px; 
        margin-top: 25px; 
        white-space: pre-wrap; 
        border-radius: 8px;
    }
    
    .user-pill { 
        background: rgba(0, 0, 0, 0.5); 
        padding: 8px 16px; 
        border-radius: 20px; 
        font-size: 0.85em; 
        margin-bottom: 25px; 
        display: inline-block;
    }
</style>
</head>
<body>

    <div id="auth-links">
        <h2>Please sign in</h2>
        <div id="sign-in-button"></div>
    </div>

    <div id="app-content">
        <button id="logout-btn">Sign Out</button>
        <hr>
        <h2>📩 AI Complaint Generator</h2>
        <textarea id="experience" placeholder="Describe your experience..."></textarea>
        <button onclick="sendRequest()">Generate Email</button>
        <div id="output"></div>
    </div>

<script>
    window.addEventListener('load', async function () {
        try {
            // FORCE Clerk to load UI components by passing an empty object
            await window.Clerk.load({}); 
            console.log("✅ Clerk UI components are now ready!");

            if (window.Clerk.user) {
                // User is logged in: show the app content
                document.getElementById('auth-links').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                
                // Add a user pill if you have an element for it
                const userName = document.getElementById('user-name');
                if (userName) {
                    userName.innerText = "User: " + window.Clerk.user.primaryEmailAddress.emailAddress;
                }
                
                document.getElementById('logout-btn').onclick = async () => {
                    await window.Clerk.signOut();
                    window.location.reload();
                };
            } else {
                // User is not logged in: mount the sign-in box
                const signInDiv = document.getElementById('sign-in-button');
                
                // Use a tiny delay to ensure the UI bundle is fully unpacked in memory
                setTimeout(() => {
                    window.Clerk.mountSignIn(signInDiv);
                }, 100);
            }
        } catch (err) {
            console.error("Clerk failed to initialize:", err);
        }
    });


    async function sendRequest() {
        const experience = document.getElementById('experience').value;
        const outputDiv = document.getElementById('output');
        if(!experience) return alert("Please enter your experience!");

        outputDiv.innerText = "AI is thinking...";
        
        try {
            const response = await fetch('/generate-email', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ experience })
            });
            const data = await response.json();
            outputDiv.innerText = data.email || "Error: " + data.error;
        } catch (err) {
            outputDiv.innerText = "Network error. Is your server running?";
        }
    }
</script>
</body>
</html>
